metadata:
  url: "https://booyaka.openpeeps.com"
  title: "Booyaka &mdash; Documentation Site Generator for Cool kids!"
  description: |
    Booyaka is a powerful documentation site generator built with the Nim
    programming language. It helps you create beautiful, fast, and
    easy-to-navigate documentation for your projects.
  keywords:
    - "documentation generator"
    - "booyaka"
    - "supranim"
    - "nim lang"
    - "documentation"

# Header Settings
header:
  # The search component settings
  search:
    # Enable or disable the search functionality
    enable: true

    # Enable indexing of meta descriptions (title, description, keywords)
    index_meta_data: true
    
    # Enable indexing of page titles (all headings)
    index_page_titles: true

# Content Settings
content:
  # Whether to show the "Last Updated" timestamp on pages
  show_last_updated: true

  # The format string for displaying the "Last Updated" timestamp
  last_date_updated_format: "yyyy-MM-dd HH:mm:ss"

  # Enable bottom navigation links for previous and next pages
  # This will show navigation links at the bottom of each documentation page
  bottom_navigation: true

  # Whether to automatically format URLs as clickable
  # links in Markdown content
  autoformat_links: true

  # # Code Syntax Highlighting Theme
  # codeHighlightTheme:
  #   # The theme to use for code syntax highlighting
  #   theme: "dracula"

  # Enable AI share buttons in the page header of documentation pages
  # This adds buttons to share content with AI services like ChatGPT, Claude, etc.
  share_ai_buttons: true
  share_buttons_ai_providers:
    - label: "Copy text"
      description: "Copy multi-line text for LLMs"
      onClick: "UI.content.copyText()"

    - label: "Copy Markdown"
      description: "Copy page content as Markdown"
      onClick: "UI.content.copyMarkdown()"

    - separator: true

    - label: "ChatGPT"
      description: "Opens ChatGPT with page content"
      url: "https://chatgpt.com/"

    - label: "Claude"
      description: "Opens Claude AI with page content"
      url: "https://claude.ai/"

    - label: "DeepSeek"
      description: "Opens DeepSeek with page content"
      url: "https://deepseek.ai/"

    - label: "DuckAI"
      description: "Ask AI privately with DuckDuckGo"
      url: "https://duckai.ai/"
    
    - separator: true

    - label: "Copy link"
      description: "Copy page link to clipboard"
      onClick: "UI.content.copyLink()"

appearance:
  # The main width of the documentation site container
  container_width: "col-lg-10 mx-auto"
  # The width of the main content area
  content_width: "col-lg-7"
  # Opacity of the background noise texture (0.0 to 1.0)
  background_noise_opacity: 0.03 # Set to 0.0 to disable background noise

