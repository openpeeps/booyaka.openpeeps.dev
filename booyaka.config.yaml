              <img class="img-fluid" src="/bug-icon.png" width="32px" height="32px" alt="Bug Icon">
            </div>
            <p class="mb-0 small d-inline">
              <strong>Found a bug?</strong><br>Create a new issue on <a href="#" class="text-link d-inline-block bg-dark" target="_blank">GitHub</a>
            </p>
          </div>
        </div>
  right_sidebar:
